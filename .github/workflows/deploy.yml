name: Deploy

# Deploys to Cloudflare Workers (free plan) when main changes, or on demand from
# the Actions tab. Everything it needs is in the repository's Settings:
#   Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, D1_DATABASE_ID, DATA_KEY,
#            PASSWORD_PEPPER, SIGNING_KEY, ADMIN_TOKEN, and optionally the Stripe,
#            Resend and ABR values listed in LAUNCH_CHECKLIST.md.
#   Variables: SITE_URL, SUPPORT_EMAIL, OPERATOR_NAME, OPERATOR_ABN, CF_BEACON_TOKEN,
#              GOOGLE_SITE_VERIFICATION.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check required settings
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          DATA_KEY: ${{ secrets.DATA_KEY }}
          PASSWORD_PEPPER: ${{ secrets.PASSWORD_PEPPER }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID DATA_KEY PASSWORD_PEPPER SIGNING_KEY SITE_URL; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then echo "::error::Missing settings:$missing (see LAUNCH_CHECKLIST.md)"; exit 1; fi
          if [ ${#DATA_KEY} -lt 32 ]; then echo "::error::DATA_KEY must be at least 32 characters"; exit 1; fi

      - run: npm run typecheck
      - run: npm test

      - name: Build site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
          OPERATOR_NAME: ${{ vars.OPERATOR_NAME }}
          OPERATOR_ABN: ${{ vars.OPERATOR_ABN }}
          CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
        run: npm run build && node --experimental-strip-types --no-warnings scripts/check-budget.ts

      - name: Point wrangler at the D1 database
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: sed -i "s/00000000-0000-0000-0000-000000000000/${D1_DATABASE_ID}/" wrangler.jsonc

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply shiftbill --remote

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Sync Worker secrets
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          DATA_KEY: ${{ secrets.DATA_KEY }}
          PASSWORD_PEPPER: ${{ secrets.PASSWORD_PEPPER }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_MONTHLY: ${{ secrets.STRIPE_PRICE_MONTHLY }}
          STRIPE_PRICE_YEARLY: ${{ secrets.STRIPE_PRICE_YEARLY }}
          STRIPE_PRICE_PACK: ${{ secrets.STRIPE_PRICE_PACK }}
          ALLOW_LIVE_PAYMENTS: ${{ secrets.ALLOW_LIVE_PAYMENTS }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          ABR_GUID: ${{ secrets.ABR_GUID }}
        run: |
          node -e '
            const names = ["SITE_URL","DATA_KEY","PASSWORD_PEPPER","SIGNING_KEY","ADMIN_TOKEN","STRIPE_SECRET_KEY","STRIPE_WEBHOOK_SECRET","STRIPE_PRICE_MONTHLY","STRIPE_PRICE_YEARLY","STRIPE_PRICE_PACK","ALLOW_LIVE_PAYMENTS","EMAIL_PROVIDER","RESEND_API_KEY","EMAIL_FROM","ABR_GUID"];
            const out = {};
            for (const n of names) if (process.env[n]) out[n] = process.env[n];
            require("fs").writeFileSync("secrets.json", JSON.stringify(out), { mode: 0o600 });
            console.log("Syncing " + Object.keys(out).length + " secrets: " + Object.keys(out).join(", "));
          '
          npx wrangler secret bulk secrets.json
          rm -f secrets.json

      - name: Health check
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          sleep 5
          curl -fsS "$SITE_URL/api/health" && echo
          curl -fsS -o /dev/null "$SITE_URL/ndis-invoice-template/" && echo "Template page OK"
